AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Hosting for sandiegotech.org — S3 origin behind CloudFront, with www
  redirecting to the apex at the edge.

  Simpler than the learn.sandiegotech.org stack: nothing on this site calls the
  account API, so there is no /api/* behavior and no second origin.

  Deploy with `./deploy.sh` (see README.md).

Parameters:
  DomainName:
    Type: String
    Default: sandiegotech.org
    Description: Apex hostname served by this distribution.

  CertificateArn:
    Type: String
    Description: >
      ACM certificate ARN covering both the apex and www. MUST be issued in
      us-east-1 — CloudFront reads certificates from that region only.

Resources:

  # ── Site bucket ─────────────────────────────────────────────────────────────
  # Private; reachable only through CloudFront via Origin Access Control.
  SiteBucket:
    Type: AWS::S3::Bucket
    Properties:
      # Not named after the domain: dots in a bucket name break the TLS
      # handshake from CloudFront (*.s3.<region>.amazonaws.com cannot match a
      # host with extra dot-separated labels).
      BucketName: !Sub '${AWS::StackName}-site'
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256

  SiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref SiteBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: 's3:GetObject'
            Resource: !Sub '${SiteBucket.Arn}/*'
            Condition:
              StringEquals:
                'AWS:SourceArn': !Sub 'arn:aws:cloudfront::${AWS::AccountId}:distribution/${Distribution}'

  OriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub 'sdit-oac-${AWS::StackName}'
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  # ── Edge function ───────────────────────────────────────────────────────────
  # Two jobs, both of which GitHub Pages used to do for us and S3 does not:
  #
  #   1. Redirect www to the apex. Today www is a Cloudflare-proxied record
  #      pointing at GitHub Pages, and GitHub issues the 301. Once DNS moves,
  #      that redirect has to come from somewhere — here.
  #   2. Serve directory indexes. Links like /papers/ resolve to
  #      /papers/index.html on GitHub Pages; S3's REST origin has no such
  #      concept and would return an error.
  #   3. Resolve extensionless URLs the way Pages does. /philosophy has to keep
  #      serving philosophy.html — the README hands that form out as the
  #      canonical URL, so inbound links use it.
  EdgeFunction:
    Type: AWS::CloudFront::Function
    Properties:
      Name: !Sub 'sdit-apex-${AWS::StackName}'
      AutoPublish: true
      FunctionConfig:
        Comment: Redirect www to apex; append index.html to directory URIs.
        Runtime: cloudfront-js-2.0
      FunctionCode: |
        function handler(event) {
          var request = event.request;
          var host = request.headers.host ? request.headers.host.value : '';

          // www -> apex, preserving path and query so ad and referral links
          // don't lose their tracking parameters on the hop.
          if (host.indexOf('www.') === 0) {
            var qs = '';
            for (var k in request.querystring) {
              qs += (qs ? '&' : '?') + k + '=' + request.querystring[k].value;
            }
            return {
              statusCode: 301,
              statusDescription: 'Moved Permanently',
              headers: {
                location: { value: 'https://sandiegotech.org' + request.uri + qs }
              }
            };
          }

          var uri = request.uri;

          // /research/ was Lectio's home before the project got its own page;
          // both slash forms of the old URL keep working. Checked before the
          // trailing-slash branch, which would otherwise send /research/ to a
          // now-deleted index object.
          if (uri === '/research' || uri === '/research/') {
            return {
              statusCode: 301,
              statusDescription: 'Moved Permanently',
              headers: { location: { value: '/lectio/' } }
            };
          }

          if (uri.endsWith('/')) {
            request.uri = uri + 'index.html';
            return request;
          }

          // Extensionless. Pages tries <uri>.html first and only then
          // <uri>/index.html; a viewer-request function gets one shot at the
          // origin and cannot fall back, so the directories are named outright
          // and everything else is assumed to be a page.
          //
          // Every link on the site already uses an explicit .html or a trailing
          // slash, so this branch only serves hand-typed and inbound URLs. That
          // also makes the failure mode mild: a new directory missing from this
          // list still works via the trailing-slash form the site itself emits.
          if (!uri.includes('.')) {
            var DIRS = [
              'papers',
              'lectio'
            ];
            var key = uri.replace(/^\/+/, '').replace(/\/+$/, '');

            // Directories redirect to the trailing-slash form rather than
            // serving it, matching GitHub Pages and keeping one canonical URL
            // per page. Same rule as the learn stack.
            if (DIRS.indexOf(key) !== -1) {
              var dqs = '';
              for (var dk in request.querystring) {
                dqs += (dqs ? '&' : '?') + dk + '=' + request.querystring[dk].value;
              }
              return {
                statusCode: 301,
                statusDescription: 'Moved Permanently',
                headers: { location: { value: uri + '/' + dqs } }
              };
            }
            request.uri = uri + '.html';
          }
          return request;
        }

  # ── Response headers ────────────────────────────────────────────────────────
  # A static site has little to exploit, but these are free and they close the
  # obvious gaps: protocol downgrade, MIME sniffing, and framing. The CSP is
  # deliberately strict because the site loads nothing from anywhere else —
  # fonts are self-hosted. The one exception is Zeffy on the support page, so
  # its script, frame, and connections are named rather than allowing all.
  SecurityHeaders:
    Type: AWS::CloudFront::ResponseHeadersPolicy
    Properties:
      ResponseHeadersPolicyConfig:
        Name: !Sub '${AWS::StackName}-security-headers'
        SecurityHeadersConfig:
          StrictTransportSecurity:
            AccessControlMaxAgeSec: 63072000
            IncludeSubdomains: true
            Preload: true
            Override: true
          ContentTypeOptions:
            Override: true
          FrameOptions:
            FrameOption: SAMEORIGIN
            Override: true
          ReferrerPolicy:
            ReferrerPolicy: strict-origin-when-cross-origin
            Override: true
          ContentSecurityPolicy:
            Override: true
            ContentSecurityPolicy: >-
              default-src 'self';
              img-src 'self' data:;
              style-src 'self' 'unsafe-inline';
              font-src 'self';
              script-src 'self' 'unsafe-inline' https://www.zeffy.com;
              frame-src https://www.zeffy.com;
              connect-src 'self' https://www.zeffy.com;
              form-action 'self' mailto: https://buttondown.com;
              base-uri 'self';
              object-src 'none'
        CustomHeadersConfig:
          Items:
            # HTML is invalidated on every deploy, so the edge can hold it; the
            # short browser max-age is what stops a reader seeing yesterday's
            # copy after a correction ships.
            - Header: Cache-Control
              Value: 'public, max-age=300, must-revalidate'
              Override: false

  # ── Distribution ────────────────────────────────────────────────────────────
  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: !Sub 'SDIT — ${DomainName}'
        Aliases:
          - !Ref DomainName
          - !Sub 'www.${DomainName}'
        DefaultRootObject: index.html
        HttpVersion: http2and3
        PriceClass: PriceClass_100
        ViewerCertificate:
          AcmCertificateArn: !Ref CertificateArn
          SslSupportMethod: sni-only
          MinimumProtocolVersion: TLSv1.2_2021

        Origins:
          - Id: s3
            DomainName: !GetAtt SiteBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt OriginAccessControl.Id
            S3OriginConfig: {}

        DefaultCacheBehavior:
          TargetOriginId: s3
          ViewerProtocolPolicy: redirect-to-https
          Compress: true
          AllowedMethods: [GET, HEAD, OPTIONS]
          # Managed-CachingOptimized
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
          ResponseHeadersPolicyId: !Ref SecurityHeaders
          FunctionAssociations:
            - EventType: viewer-request
              FunctionARN: !GetAtt EdgeFunction.FunctionMetadata.FunctionARN

        # S3 returns 403 (not 404) for a missing object when ListBucket is not
        # granted, so both have to map to the site's own error page.
        CustomErrorResponses:
          - ErrorCode: 403
            ResponseCode: 404
            ResponsePagePath: /404.html
            ErrorCachingMinTTL: 60
          - ErrorCode: 404
            ResponseCode: 404
            ResponsePagePath: /404.html
            ErrorCachingMinTTL: 60

Outputs:
  DistributionId:
    Description: Needed to invalidate the cache after a deploy.
    Value: !Ref Distribution

  DistributionDomain:
    Description: >
      Test URL. Verify here BEFORE pointing DNS at it — until then GitHub Pages
      is still serving the real domain.
    Value: !GetAtt Distribution.DomainName

  BucketName:
    Description: Sync the site into this bucket to publish.
    Value: !Ref SiteBucket

  DnsTarget:
    Description: >
      Final step only. At Cloudflare, point BOTH sandiegotech.org and
      www.sandiegotech.org here, set to DNS only (grey cloud).
    Value: !GetAtt Distribution.DomainName
