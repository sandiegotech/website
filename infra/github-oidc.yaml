AWSTemplateFormatVersion: '2010-09-09'
Description: >
  GitHub Actions deploy identity for sandiegotech.org.

  Kept in its own stack, apart from sdit-apex-web, because the OIDC provider is
  an account-wide singleton: only one can exist for token.actions.githubusercontent.com,
  and folding it into the website stack would mean deleting that stack takes the
  provider — and every other repo's ability to deploy — down with it.

  Deploy with:
    aws cloudformation deploy \
      --template-file github-oidc.yaml \
      --stack-name sdit-github-oidc \
      --region us-west-2 \
      --capabilities CAPABILITY_IAM

Parameters:
  GitHubOrg:
    Type: String
    Default: sandiegotech

  RepoName:
    Type: String
    Default: website

  Branch:
    Type: String
    Default: main
    Description: >
      Only this branch may assume the role. A pull request from a fork runs
      with a different subject claim and is refused, so untrusted contributors
      cannot reach the bucket.

  SiteStackName:
    Type: String
    Default: sdit-apex-web
    Description: Stack whose outputs the deploy script reads.

  DistributionId:
    Type: String
    Description: >
      Distribution the role may invalidate. Passed in rather than imported from
      the site stack on purpose: an exported output cannot be changed while
      another stack imports it, which would block ever replacing the
      distribution. Read it with
        aws cloudformation describe-stacks --stack-name sdit-apex-web \
          --query "Stacks[0].Outputs[?OutputKey=='DistributionId'].OutputValue"

Resources:

  GitHubOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList:
        - sts.amazonaws.com
      # AWS validates GitHub's certificate chain against its own trust store and
      # no longer relies on these, but the property is still required.
      ThumbprintList:
        - 6938fd4d98bab03faadb97b34396831e3780aea1
        - 1c58a3a8518e8759bf075b76b750d4f2df264fcd

  DeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub 'sdit-${RepoName}-deploy'
      Description: Assumed by GitHub Actions to publish the site to S3.
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Ref GitHubOidcProvider
            Action: 'sts:AssumeRoleWithWebIdentity'
            Condition:
              StringEquals:
                # Audience AND subject both pinned. Without the sub condition
                # any repository on GitHub could assume this role.
                'token.actions.githubusercontent.com:aud': 'sts.amazonaws.com'
                'token.actions.githubusercontent.com:sub': !Sub 'repo:${GitHubOrg}/${RepoName}:ref:refs/heads/${Branch}'

      Policies:
        - PolicyName: publish-site
          PolicyDocument:
            Version: '2012-10-17'
            Statement:

              # deploy.sh resolves the bucket and distribution by reading the
              # site stack's outputs rather than hardcoding them.
              - Sid: ReadStackOutputs
                Effect: Allow
                Action: 'cloudformation:DescribeStacks'
                Resource: !Sub 'arn:aws:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${SiteStackName}/*'

              - Sid: ListSiteBucket
                Effect: Allow
                Action: 's3:ListBucket'
                Resource: !Sub 'arn:aws:s3:::${SiteStackName}-site'

              # DeleteObject is required by `aws s3 sync --delete`, which is what
              # makes a page removed from the repo disappear from the site.
              - Sid: WriteSiteObjects
                Effect: Allow
                Action:
                  - 's3:GetObject'
                  - 's3:PutObject'
                  - 's3:DeleteObject'
                Resource: !Sub 'arn:aws:s3:::${SiteStackName}-site/*'

              - Sid: InvalidateCache
                Effect: Allow
                Action: 'cloudfront:CreateInvalidation'
                Resource: !Sub 'arn:aws:cloudfront::${AWS::AccountId}:distribution/${DistributionId}'

Outputs:
  DeployRoleArn:
    Description: Set as the role-to-assume in .github/workflows/deploy.yml.
    Value: !GetAtt DeployRole.Arn

  OidcProviderArn:
    Description: Reusable by other repos in this account.
    Value: !Ref GitHubOidcProvider
    Export:
      Name: sdit-github-oidc-provider
